name: Build APK

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type'
        type: choice
        options: [ both, debug, release ]
        default: both

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle (with caching)
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build debug APK
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.build_type != 'release' }}
        run: ./gradlew assembleDebug --stacktrace

      - name: Build release APK
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.build_type != 'debug' }}
        run: ./gradlew assembleRelease --stacktrace

      - name: Upload debug APK
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.build_type != 'release' }}
        uses: actions/upload-artifact@v4
        with:
          name: Spotui-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload release APK
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.build_type != 'debug' }}
        uses: actions/upload-artifact@v4
        with:
          name: Spotui-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Publish GitHub Release (tags only)
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/*.apk
          generate_release_notes: true
