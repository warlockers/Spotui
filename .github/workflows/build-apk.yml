name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle
    - run: chmod +x ./gradlew
    - run: ./gradlew assembleRelease
    - uses: actions/upload-artifact@v4
      with:
        name: spotui-apk
        path: app/build/outputs/apk/release/Spotui_v*.apk
        retention-days: 30
